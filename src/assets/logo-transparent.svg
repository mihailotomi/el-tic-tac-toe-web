<svg width="80%" height="80%" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" style='background-color: transparent;'>
  <!-- Tic Tac Toe Grid -->
  <!-- Draw the two vertical lines -->
  <line x1="100" y1="0" x2="100" y2="300" stroke="#FFFFFF" stroke-width="8"/>
  <line x1="200" y1="0" x2="200" y2="300" stroke="#FFFFFF" stroke-width="8"/>
  <!-- Draw the two horizontal lines -->
  <line x1="0" y1="100" x2="300" y2="100" stroke="#FFFFFF" stroke-width="8"/>
  <line x1="0" y1="200" x2="300" y2="200" stroke="#FFFFFF" stroke-width="8"/>
  
  <!-- Basketball Icon in the center cell -->
  <!-- Placed at the center of the grid (150,150) with a radius of 30 -->
  <circle cx="150" cy="150" r="30" fill="transparent" stroke="#FFFFFF" stroke-width="4" />

  <!-- Basketball panel lines (minimal curves to evoke the ball's design) -->
  <!-- A curved vertical line -->
  <path d="M130,130 Q145,150 170,170" stroke="#FFFFFF" stroke-width="3" fill="none"/>
  <path d="M122,145 Q150,150 150,120" stroke="#FFFFFF" stroke-width="3" fill="none"/>
  <path d="M145,180 Q150,150 182,150" stroke="#FFFFFF" stroke-width="3" fill="none"/>
  <path d="M130,172 Q145,145 178,135" stroke="#FFFFFF" stroke-width="3" fill="none"/>
</svg>
